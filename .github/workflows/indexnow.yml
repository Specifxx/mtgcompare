name: IndexNow submit

# Daily: submit every sitemap URL to IndexNow so Bing and Yandex recrawl
# (scripts/indexnow-submit.ts). Google does not take IndexNow — it reads the
# sitemap via Search Console (search-console.yml). No-op until the INDEXNOW_KEY
# variable (or secret) is set. SITE_URL defaults to https://opcompare.app.
on:
  schedule:
    - cron: "10 8 * * *"
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://opcompare.app' }}
      INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY || secrets.INDEXNOW_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes tsx scripts/indexnow-submit.ts

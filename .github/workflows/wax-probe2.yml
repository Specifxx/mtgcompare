name: WaxCompare store probe, round 2

# Research only, on this claude/* branch: round 2 reads wax-probe/candidates2.txt (Shopify as round 1, plus a
# platform sniff of the non-Shopify sites) and commits wax-probe/results2.json.

on:
  push:
    branches: ["claude/**"]
    paths: ["wax-probe/candidates2.txt", "wax-probe/probe2.mjs"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node wax-probe/probe2.mjs
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp wax-probe/results2.json /tmp/results2.json
          for i in 1 2 3 4 5; do
            git fetch origin ${GITHUB_REF_NAME}
            git checkout -q -B ${GITHUB_REF_NAME} FETCH_HEAD
            cp /tmp/results2.json wax-probe/results2.json
            git add wax-probe/results2.json
            git commit -q -m "wax probe round 2: store results" || exit 0
            git push origin HEAD:${GITHUB_REF_NAME} && exit 0
            sleep $((2 ** i))
          done
          exit 1

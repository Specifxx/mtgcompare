name: TEMP probe candidate stores

# Temporary (2026-10-28): probes stores the sister sites list but MTG Compare doesn't, one runner per market, and commits the
# results to this branch for review. Removed before the branch is merged.

on:
  push:
    branches: [claude/project-thread-jku8eb]
    paths: [probe-in/**, .github/workflows/probe-stores-tmp.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        market: [AU, CA, EU, NZ, SG, UK, US]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/probe-stores.ts --in probe-in/${{ matrix.market }}.json --out probe-out/${{ matrix.market }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.market }}
          path: probe-out/${{ matrix.market }}.json
          if-no-files-found: ignore

  commit:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: probe-out
          pattern: probe-*
          merge-multiple: true
      - run: |
          git config user.name "mtgcompare-data[bot]"
          git config user.email "mtgcompare-data@users.noreply.github.com"
          git add probe-out
          git commit -m "TEMP probe results (run ${GITHUB_RUN_ID})"
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done
          exit 1

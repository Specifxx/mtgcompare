name: MTG Compare card prices

# The most valuable single cards of each set we sell sealed for (DECISIONS.md, 2026-11-17 "Card prices"): scripts/card-import.ts
# reads TCGplayer's public Magic price files (TCGCSV, no key), picks today's list and commits data/cards/mtg-cards.json to main.
# The commit carries NO deploy marker: it rides the evening sealed import's release (20:47 UTC). No eBay call, no database.
on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

concurrency:
  group: mtgcompare-card-prices
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Read card prices
        run: npx tsx scripts/card-import.ts
      - name: Commit to main
        run: |
          git config user.name "mtgcompare-data[bot]"
          git config user.email "mtgcompare-data@users.noreply.github.com"
          cp data/cards/mtg-cards.json "$RUNNER_TEMP/cards.json" 2>/dev/null || { echo "No card file."; exit 0; }
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            mkdir -p data/cards
            cp "$RUNNER_TEMP/cards.json" data/cards/mtg-cards.json
            git add data/cards/mtg-cards.json
            if git diff --cached --quiet; then echo "Unchanged."; exit 0; fi
            git commit -q -m "MTG Compare card prices: $(date -u +%Y-%m-%dT%H:%MZ) (card-prices.yml run ${{ github.run_id }})"
            if git push -q origin HEAD:main; then echo "Pushed on attempt $attempt."; exit 0; fi
            sleep $((attempt * 5))
          done
          echo "Could not push after 5 attempts." >&2
          exit 1

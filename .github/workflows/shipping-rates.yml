name: MTG Compare shipping rates

# Weekly: measure what each Shopify store in src/data/stores.json really charges to post ONE sealed product, from its own storefront
# quote, to several addresses per market (scripts/probe-shipping-rates.ts; addresses in src/lib/shipping-probe.ts), then condense the
# runs into src/data/shipping-rates.json (scripts/build-shipping-rates.ts) and commit it to main.
#
# The commit's subject carries NO [deploy]: the file rides the next daily sealed-import release (CLAUDE.md, "Deploys"). The site reads
# the file bundled at build time; nothing calls a store at request time, and there is no database involved.
#
# One job per market (each on its own runner, so Shopify's per-IP throttle sees one market's stores at a time), politely: three stores at
# once, one request per store at a time at least a second apart, backoff on 429/5xx (the script's defaults). A store this run could
# not measure keeps its previous measurement for up to 42 days (lib/shipping-probe.ts mergeSnapshots), then shows
# "Shipping at checkout". The build refuses to write when fewer than --min-stores were measured (a blocked run never empties the file).

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      markets:
        description: "Markets to probe, comma-separated (AU,NZ,US,UK,CA,EU,SG). Blank = all."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: mtgcompare-shipping-rates
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      markets: ${{ steps.m.outputs.markets }}
    steps:
      - id: m
        env:
          WANT: ${{ inputs.markets }}
        run: |
          WANT="${WANT:-AU,NZ,US,UK,CA,EU,SG}"
          if ! printf '%s\n' "$WANT" | grep -Eq '^(AU|NZ|US|UK|CA|EU|SG)(,(AU|NZ|US|UK|CA|EU|SG))*$'; then
            echo "::error::markets takes AU,NZ,US,UK,CA,EU,SG separated by commas"; exit 1
          fi
          echo "markets=$(printf '%s' "$WANT" | jq -R -c 'split(",")')" >> "$GITHUB_OUTPUT"

  probe:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        market: ${{ fromJson(needs.plan.outputs.markets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Probe ${{ matrix.market }}
        run: npx tsx scripts/probe-shipping-rates.ts --market=${{ matrix.market }} --concurrency=3 --delay-ms=1000 --out=probe/ship-${{ matrix.market }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ship-${{ matrix.market }}
          path: probe/ship-${{ matrix.market }}.json
          if-no-files-found: ignore
          retention-days: 30

  publish:
    needs: probe
    if: always() && needs.probe.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          path: probe
          pattern: ship-*
          merge-multiple: true
      - name: Build src/data/shipping-rates.json
        run: |
          ls probe/*.json >/dev/null 2>&1 || { echo "No probe output — nothing to publish." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          npx tsx scripts/build-shipping-rates.ts probe/*.json --min-stores=20 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit to main, without [deploy] (it rides the next daily release)
        run: |
          set -euo pipefail
          F=src/data/shipping-rates.json
          git config user.name "mtgcompare-data[bot]"
          git config user.email "mtgcompare-data@users.noreply.github.com"
          if git diff --quiet -- "$F"; then echo "Unchanged."; exit 0; fi
          cp "$F" /tmp/shipping-rates.json
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp /tmp/shipping-rates.json "$F"
            git add "$F"
            if git diff --cached --quiet; then echo "main already has it."; exit 0; fi
            git commit -q -m "MTG Compare shipping rates: $(date -u +%Y-%m-%d) (shipping-rates.yml run ${GITHUB_RUN_ID})" -m "Measured from each store's own checkout (scripts/probe-shipping-rates.ts)."
            if git push -q origin HEAD:main; then echo "Pushed $(git rev-parse --short HEAD)."; exit 0; fi
            sleep $((attempt * 5))
          done
          echo "Could not push after 5 attempts." >&2; exit 1

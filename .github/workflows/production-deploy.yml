name: Production deploy

# ONE Vercel production build a WEEK (owner, 2026-10-08; it was one a day in RiftCompare and OP Compare). The release ships CODE. Prices, stores, history, the
# catalogue and every public view are DATA: the daily import publishes them to the data repository and moves one pointer (no purge, no deploy), so a week-old
# deployment serves today's prices and nothing here is needed to make data appear (CLAUDE.md "Deploys are gated", contract section 13).
#
# vercel.json's ignoreCommand (scripts/vercel-ignore-build.sh) skips every push whose commit SUBJECT lacks [deploy]. This workflow lands one empty commit,
# `release: weekly production deploy [deploy]`, on the production branch every TUESDAY at 08:00 UTC, and Vercel builds that. "Run workflow" deploys now (an urgent release).
# On a schedule, nothing new since the last release means no commit. The cron is the constant RELEASE_CRON in src/lib/release-schedule.ts; tests/deploy-cadence.test.ts pins the two together.
#
# Scheduled workflows run only from the repository's DEFAULT branch, and the release lands on the branch the run started from (github.ref_name: the default branch on a
# schedule), which must be Vercel's production branch. It named `main` until 2026-10-10, a branch this repository never had, so no weekly release could run.
on:
  schedule:
    - cron: "0 8 * * 2"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why an unscheduled release (it is written into the release commit body)"
        type: string
        required: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2
      - name: Decide whether anything landed since the last release
        id: check
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # A release lands only on the default branch (the production branch): a dispatch from any other branch would push a release commit there and build only a skipped preview.
          default="$(git ls-remote --symref origin HEAD | sed -n 's|^ref: refs/heads/\(.*\)\tHEAD$|\1|p')"
          if [ -n "$default" ] && [ "$BRANCH" != "$default" ]; then
            echo "::error title=Release::run this workflow from the default branch ($default), not $BRANCH"
            exit 1
          fi
          subject="$(git log -1 --format=%s)"
          if [ "$EVENT" = "schedule" ] && printf '%s' "$subject" | grep -qiF '[deploy]'; then
            echo "Newest commit is already a release ($subject) - nothing to deploy this week."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Land the release commit
        if: steps.check.outputs.go == 'true'
        env:
          REASON: ${{ inputs.reason }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$REASON" ]; then
            git commit --allow-empty -m "release: manual production deploy [deploy]" -m "$REASON"
          else
            git commit --allow-empty -m "release: weekly production deploy [deploy]"
          fi
          git push origin "HEAD:$BRANCH"

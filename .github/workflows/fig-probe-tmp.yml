name: TEMP figure store probe

# Temporary (2026-10-28): research only. Checks which known stores sell Nendoroid/figma/Gunpla and whether their
# public product data carries JAN barcodes, and commits the results to this branch. Never merged.

on:
  push:
    branches: [claude/project-thread-q8nkuu]
    paths: [figprobe/probe.py, figprobe/stores.json, .github/workflows/fig-probe-tmp.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: python3 figprobe/probe.py
      - run: |
          git config user.name "mtgcompare-data[bot]"
          git config user.email "mtgcompare-data@users.noreply.github.com"
          git add figprobe/out.json
          git commit -m "TEMP figure probe results (run ${GITHUB_RUN_ID})"
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done
          exit 1

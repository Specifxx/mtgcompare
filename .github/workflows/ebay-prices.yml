name: eBay prices

# THE ONLY EBAY WORKFLOW (scripts/ebay.ts). Four runs a day, all AFTER RiftCompare's big jobs, because MTG Compare shares RiftCompare's eBay keyset (EBAY_KEYSET_MODE=shared: 5,000 Browse calls
# a day for both sites, Rift first):
#   04:37  banner only   the chase pool's US names (the strip is refreshed every 6 hours)
#   10:37  banner only
#   16:37  banner only   before Rift's 19:00 evening refresh
#   23:37  MAIN          the chase pool in every market, tier A (daily), tier B (every 72 h), sealed; after Rift's 19:00 job, the 20:00 auction sweep, the 21:47 sibling run and MTG's own import
# Minute 37 keeps clear of the top-of-hour pile-up that delays Rift's jobs. Nothing is scheduled between 21:05 and 23:30 UTC, the import window (src/lib/schedule.ts IMPORT_WINDOW_UTC); a manual
# run should avoid it too, because the quiet check waits for the quota to stop moving.
#
# Each run spends at most min(the day's ledger allowance, the live remaining count minus RiftCompare's reserve, the run's share, max_calls). It reads the live quota first and fails CLOSED:
# an unreadable quota, an unreachable ledger, a 429 or a kill switch (EBAY_API_ENABLED=0) means zero Browse calls and a green run with the reason on the run page. EBAY_OBSERVE_ONLY=1 (opt-in since
# 2026-10-10; unset or 0 spends) reads and records the quota and makes no Browse call at all.
#
# It READS a pull of the current published tree (scripts/plane-checkout.sh, which calls scripts/plane-pull.ts) and writes NEON ONLY, in its own tables: eBay data never reaches GitHub (licence) and is never a row of the plane table. It never pushes and never writes the published data,
# so it shares no concurrency group with the import.
#
# OFF until the repository secrets EBAY_CLIENT_ID and EBAY_CLIENT_SECRET exist (the gate job then skips the eBay job and the run is green). Keys set but refused by eBay: the run fails red after
# zero Browse calls. Searches failing without a 429 (an outage, a keyset not approved for Browse) stop the run after 10 in a row and fail it red (lib/ebay-plan.ts FailureBreaker).
on:
  schedule:
    - cron: "37 4 * * *"
    - cron: "37 10 * * *"
    - cron: "37 16 * * *"
    - cron: "37 23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "EBAY_FORCE=1: a main pass that re-searches every eligible pair (tick after a matching change). Avoid 21:05 to 23:30 UTC."
        type: boolean
        default: false
      only_market:
        description: "One of US UK AU EU CA SG (blank = all)"
        type: string
        required: false
      max_calls:
        description: "A main pass capped at N Browse calls (smoke test: 50). Can never raise the budget; the ledger and the live quota still apply."
        type: string
        required: false

# Never pushes.
permissions:
  contents: read

jobs:
  # Decides whether there is anything to do. While eBay is off (no secrets) a scheduled run does nothing and is green.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Skip unless eBay and the database are configured
        id: gate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$EBAY_CLIENT_ID" ] || [ -z "$EBAY_CLIENT_SECRET" ]; then
            echo "eBay not configured (or no DATABASE_URL), skipping (0 calls)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

  ebay:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Its own group: two eBay runs never overlap (a second waits), and nothing here touches the data repository.
    concurrency:
      group: ebay-mtg
      cancel-in-progress: false
    # No secret at job level: npm ci's install scripts never see one. Each step gets only what it needs.
    env:
      EBAY_API_ENABLED: ${{ vars.EBAY_API_ENABLED }}
      EBAY_DAILY_CALL_BUDGET: ${{ vars.EBAY_DAILY_CALL_BUDGET }}
      EBAY_KEYSET_MODE: ${{ vars.EBAY_KEYSET_MODE }}
      EBAY_OBSERVE_ONLY: ${{ vars.EBAY_OBSERVE_ONLY }}
      EBAY_QUOTA_RESERVE: ${{ vars.EBAY_QUOTA_RESERVE }}
      EBAY_MAX_CALLS: ${{ vars.EBAY_MAX_CALLS }}
      EBAY_MIN_VALUE_CENTS: ${{ vars.EBAY_MIN_VALUE_CENTS }}
      EBAY_REFRESH: ${{ github.event_name != 'push' }}
      EBAY_FORCE: ${{ inputs.force && '1' || '' }}
      EBAY_ONLY_MARKET: ${{ inputs.only_market }}
      EBAY_DISPATCH_CAP: ${{ inputs.max_calls }}
      # The cron line of a scheduled run, empty for a dispatch (a main run): GitHub starts these crons up to seven hours late, so the clock cannot tell the 23:37 main pass from a banner run.
      EBAY_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The same additive sync as import-prices.yml (no --accept-data-loss).
      - name: Sync schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/db-push-safe.sh && npx prisma generate
      # The CURRENT published tree, read-only: pulled from the Neon-backed plane with DATABASE_URL (the default; scripts/plane-pull.ts), or with PLANE_BACKEND=github the pointed commit of the private data repository. Without it (nothing published, the source unreachable) the pass still reads and records the quota and
      # leaves the tiers as they were: a missing checkout never fails the run and never spends a call.
      - name: Read the published data
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PLANE_BACKEND: ${{ vars.PLANE_BACKEND }}
          PLANE_REPO: ${{ vars.PLANE_REPO }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: bash scripts/plane-checkout.sh .data
      - name: eBay pass
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          NEXT_PUBLIC_EBAY_CAMPAIGN_ID: ${{ vars.NEXT_PUBLIC_EBAY_CAMPAIGN_ID }}
          # The site to purge after a run that wrote (POST /api/revalidate?tag=ebay-banner): REVALIDATE_URL, else SITE_URL, else the production domain.
          REVALIDATE_URL: ${{ vars.REVALIDATE_URL || vars.SITE_URL || 'https://mtgcompare.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: npx tsx scripts/ebay.ts .data

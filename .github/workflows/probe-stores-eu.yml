# Store probe over a research candidate list (scripts/probe-stores.ts --write).
# Runs only on a claude/** branch, where it commits the merged src/data/stores.json
# and the probe output back to that branch for review in its pull request. It
# never runs on main and never deploys.
name: Probe stores (research)
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Candidate list"
        type: string
        default: research/eu-candidates-2026-11-26.json
  push:
    branches: ["claude/**"]
    paths:
      - "research/eu-candidates-*.json"
permissions:
  contents: write
jobs:
  probe:
    if: startsWith(github.ref_name, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate || true
      - run: npx tsx scripts/probe-stores.ts --in "${{ inputs.file || 'research/eu-candidates-2026-11-26.json' }}" --out research/probe-eu.json --write --concurrency 8 | tee research/probe-eu.log
      - name: Keep the result on the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -f src/data/stores.json research/probe-eu.json research/probe-eu.log || true
          git commit -m "Research: EU store probe result (${{ github.run_id }})" || exit 0
          git pull --rebase -q origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}

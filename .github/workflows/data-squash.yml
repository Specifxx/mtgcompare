name: Data squash

# Weekly, Sunday 23:50 UTC. The branch `data` of the PRIVATE data repository becomes ONE parentless commit with the current tree; the d-* tags older than 7 days are deleted EXCEPT the tags of latest.json's `ref` and `prev`,
# and the job refuses to run when the pointer is older than 5 days (critique DP-11). Prefers the API-created commit (no upload); falls back to a plain force push (one extra tree upload a week).
on:
  schedule:
    - cron: "50 23 * * 0"
  workflow_dispatch:

concurrency:
  group: data-publish
  queue: max

permissions:
  contents: read

jobs:
  squash:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLANE_BACKEND: ${{ vars.PLANE_BACKEND }}
      PLANE_REPO: ${{ vars.PLANE_REPO }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/data-squash.ts

name: Bandai card games probe (temporary research)
on:
  push:
    branches: [claude/project-thread-r5d8h6]
    paths: ["research/bandai/**", ".github/workflows/bandai-probe.yml"]
jobs:
  stores:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3, 4, 5, 6, 7] }
    steps:
      - uses: actions/checkout@v4
      - run: awk 'NR % 8 == ${{ matrix.shard }}' research/bandai/stores.txt > shard.txt && python3 research/bandai/probe.py shard.txt
      - uses: actions/upload-artifact@v4
        with: { name: "probe-${{ matrix.shard }}", path: probe-result.json }
  tcgcsv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 research/bandai/tcgcsv.py
      - uses: actions/upload-artifact@v4
        with: { name: tcgcsv, path: tcgcsv-result.json }

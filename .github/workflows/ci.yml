name: CI

# Typecheck, lint and the unit tests on every pull request and every push to
# main. Database-free and network-free: nothing here needs a secret.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

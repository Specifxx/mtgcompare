name: Stripe setup

# Run by hand once Stripe is connected (and again after changing a price in
# src/lib/plans.ts): creates or updates OP Compare's products, prices and
# billing-portal configuration (scripts/stripe-setup.ts). Idempotent; prints
# only ids. Needs the STRIPE_SECRET_KEY secret.
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      SITE_URL: ${{ vars.SITE_URL || 'https://opcompare.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/stripe-setup.ts

name: Singles trial import

# A scratch run for the new singles site (not part of MTG Compare, never merged): runs its importer against TCGplayer's public
# price files and commits the result under singles-trial/data on this branch, so the build can be checked with real data.
on:
  push:
    branches: ["claude/project-thread-wmoyr8"]
    paths: ["singles-trial/TRIGGER", ".github/workflows/singles-trial.yml"]

permissions:
  contents: write

concurrency:
  group: singles-trial
  cancel-in-progress: false

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: singles-trial
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Import
        working-directory: singles-trial
        run: npx tsx scripts/import.ts
      - name: Shape report
        working-directory: singles-trial
        run: |
          du -sh data data/cards data/history || true
          node -e '
            const fs=require("fs"),p="data/cards/pokemon/";
            const sets=JSON.parse(fs.readFileSync(p+"sets.json")).sets;
            const rar={},fin={};let n=0,nonum=0;
            for(const s of sets){for(const c of JSON.parse(fs.readFileSync(p+"sets/"+s.slug+".json")).cards){n++;rar[c.r]=(rar[c.r]||0)+1;if(!c.no)nonum++;for(const k of Object.keys(c.p))fin[k]=(fin[k]||0)+1;}}
            console.log("cards",n,"no number",nonum);console.log("rarities",JSON.stringify(rar));console.log("printings",JSON.stringify(fin));
            console.log("largest sets",JSON.stringify(sets.sort((a,b)=>b.cards-a.cards).slice(0,8).map(s=>[s.name,s.cards])));
          '
      - name: Commit the data to this branch
        run: |
          git config user.name "singles-trial[bot]"
          git config user.email "singles-trial@users.noreply.github.com"
          git add -A singles-trial/data
          git diff --cached --quiet && { echo "Nothing."; exit 0; }
          git commit -q -m "Singles trial data (run ${{ github.run_id }})"
          git push -q origin "HEAD:${{ github.ref_name }}"

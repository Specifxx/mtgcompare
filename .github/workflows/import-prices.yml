name: Import prices

# THE DAILY PUBLISH (contract sections 6.4 and 6.6). The importer reads NOTHING from Neon: its memory is a depth-1 checkout of the data repository. Phase 1 (catalogue, prices, history, free views) goes live about 10 minutes after the start;
# phase 2 (store offers and aggregates) 35 to 75 minutes later. Every data push goes to the PRIVATE data repository (vars/secrets: PLANE_REPO, DATA_REPO_TOKEN); GITHUB_TOKEN cannot write another repository.
# Concurrency: ONE group for every writer of the data repository, with `queue: max` (critique DP-10: the default single pending slot lets a newer run cancel the older pending one).
on:
  schedule:
    - cron: "25 21 * * *"
    - cron: "55 21 * * *"
    - cron: "25 22 * * *"
  workflow_dispatch:
    inputs:
      force: { description: "Import even if the sources have not changed (IMPORT_FORCE=1)", type: boolean, required: false, default: false }
      stores: { description: "Run the store stage (phase 2)", type: boolean, required: false, default: true }
      only_stores: { description: "Comma-separated store keys (empty = all)", type: string, required: false }
      scryfall: { description: "auto or off", type: string, required: false, default: auto }
      alerts: { description: "Run alerts, newsletter and digests after the publish", type: boolean, required: false, default: true }

concurrency:
  group: data-publish
  queue: max

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PLANE_REPO: ${{ vars.PLANE_REPO }}
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
      REVALIDATE_URL: ${{ vars.REVALIDATE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      IMPORT_FORCE: ${{ inputs.force && '1' || '' }}
      SCRYFALL_MODE: ${{ inputs.scryfall == 'off' && 'off' || '' }}
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Restore the Scryfall slim cache and the match index
        uses: actions/cache@v4
        with:
          path: .cache
          key: import-cache-${{ github.run_id }}
          restore-keys: import-cache-
      - name: Gate, phase 1 (catalogue, prices, history, free views), pointer, hook
        run: npx tsx scripts/import.ts --phase catalog
      # A scheduled run has no inputs: `inputs.stores` is null there, and GitHub compares null with false as numbers (0 != 0 is false), so `inputs.stores != false` would skip these steps on every cron run.
      # The condition names the event instead: a schedule runs them, a manual run runs them unless the box is unticked.
      - name: Phase 2 (store offers and aggregates), pointer, hook
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.stores }}
        run: npx tsx scripts/import.ts --phase full --only-stores "${{ inputs.only_stores }}"
      - name: Check out the pointed tree into .data (the alerts step reads .data/v1; a retry that published nothing leaves the same tree)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.alerts }}
        run: bash scripts/plane-checkout.sh .data
      - name: Alerts, newsletter, digests (read .data/v1; Neon only for the user rows)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.alerts }}
        run: npx tsx scripts/alerts.ts

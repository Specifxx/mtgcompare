ion }); // Check cart once after all products are initialized setTimeout(() => window.checkCartAndUpdateUI(), 100); } // Initialize product options with inventory indicators function initializeProductOptions(container, skipCartCheck = false) { // Select the first available variant by default const variants = JSON.parse(container.getAttribute('data-variants')); if (!variants || variants.length === 0) return; const buttons = container.querySelectorAll('.variant-option-button'); const variantSelect = container.querySelector('.variant-option-select'); if (buttons.length > 0) { // Highlight the first button by default window.selectVariantCombination(buttons[0], skipCartCheck); } else if (variantSelect && variantSelect.value) { window.selectVariantCombinationFromSelect(variantSelect, skipCartCheck); } } // Function to select a variant combination window.selectVariantCombination = window.selectVariantCombination || function(button, skipCartCheck = false) { const container = button.closest('[data-product-container]'); // Remove active class from all buttons container.querySelectorAll('.variant-option-button').forEach(btn => { btn.classList.remove( 'bg-[#52aa98]', 'text-[#343146]', 'ring-1' ); btn.classList.add( 'bg-white', 'text-[#343144]' ); }); // Add active class to selected button button.classList.remove( 'bg-white', 'text-[#343144]' ); button.classList.add( 'bg-[#52aa98]', 'text-[#343146]', 'ring-1' ); // Get the combination text and find matching variant const combinationText = button.getAttribute('data-variant-combo'); const comboValues = combinationText.split(' / '); // Get variants data and find matching variant const variants = JSON.parse(container.getAttribute('data-variants')); const matchedVariant = findVariantByCombination(variants, comboValues); if (matchedVariant) { updateProductDisplay(container, matchedVariant); // Check if we need to switch between add button and quantity modifier // when variant changes - use setTimeout to ensure variant ID is updated first if (!skipCartCheck) { setTimeout(() => window.checkCartAndUpdateSingleContainer(container), 50); } } }; window.selectVariantCombinationFromSelect = window.selectVariantCombinationFromSelect || function(selectEl, skipCartCheck = false) { const container = selectEl.closest('[data-product-container]'); const combinationText = selectEl.value; if (!combinationText) return; const comboValues = combinationText.split(' / '); const variants = JSON.parse(container.getAttribute('data-variants')); const matchedVariant = findVariantByCombination(variants, comboValues); if (matchedVariant) { updateProductDisplay(container, matchedVariant); if (!skipCartCheck) { setTimeout(() => window.checkCartAndUpdateSingleContainer(container), 50); } } }; // Find a variant by option combination function findVariantByCombination(variants, comboValues) { return variants.find(variant => { // Match all option values for (let i = 0; i < comboValues.length; i++) { if (variant.options[i]?.value !== comboValues[i]) { return false; } } return true; }); } // Function to update button icons based on quantity function updateButtonIcons(container, quantity) { const decreaseBtn = container.querySelector('[data-decrease-btn]'); if (!decreaseBtn) return; const minusIcon = decreaseBtn.querySelector('.minus-icon'); const trashIcon = decreaseBtn.querySelector('.trash-icon'); if (quantity <= 1) { // Show trash icon if (minusIcon) minusIcon.style.display = 'none'; if (trashIcon) trashIcon.style.display = 'block'; } else { // Show minus icon if (minusIcon) minusIcon.style.display = 'block'; if (trashIcon) trashIcon.style.display = 'none'; } } // Cache for cart data to avoid excessive API calls window.cartCache = window.cartCache || null; window.cartCacheTime = window.cartCacheTime || 0; window.CART_CACHE_DURATION = window.CART_CACHE_DURATION || 2000; // 2 seconds // Function to get cart data (with caching) window.getCartData = window.getCartData || async function() { const now = Date.now(); if (window.cartCache && (now - window.cartCacheTime) < window.CART_CACHE_DURATION) { return window.cartCache; } try { const response = await fetch('/api/cart'); const cart = await response.json(); window.cartCache = cart; window.cartCacheTime = now; return cart; } catch (error) { console.error('Error fetching cart:', error); return { items: [] }; } }; // Function to update UI for a specific container function updateContainerCartUI(container, cart) { const product = JSON.parse(container.getAttribute('data-variants')); if (!product || product.length === 0) return; // Don't update UI if there's an active error message if (container.getAttribute('data-has-error') === 'true') { return; } // Get the current selected variant ID const variantIdInput = container.querySelector('[data-variant-id]'); const currentVariantId = variantIdInput ? variantIdInput.value : null; if (!currentVariantId) return; // Find if this specific variant is in the cart const cartItem = cart.items ? cart.items.find(item => item.variant && item.variant.id === currentVariantId ) : null; const addForm = container.querySelector('[data-add-form]'); const quantityModifier = container.querySelector('[data-quantity-modifier]'); const quantitySpan = container.querySelector('[data-quantity]'); if (cartItem) { // Show quantity modifier for this specific variant if (addForm) addForm.style.display = 'none'; if (quantityModifier) { quantityModifier.style.display = 'flex'; // Set the item ID and quantity quantityModifier.setAttribute('data-item-id', cartItem.id); if (quantitySpan) { quantitySpan.textContent = cartItem.quantity; // Update button icons based on quantity updateButtonIcons(container, cartItem.quantity); } } } else { // Show add to cart button - this variant is not in cart if (addForm) addForm.style.display = 'block'; if (quantityModifier) quantityModifier.style.display = 'none'; } } // Function to check cart and update UI for all containers window.checkCartAndUpdateUI = window.checkCartAndUpdateUI || async function() { tr }); // Add active class to selected button button.classList.remove( 'bg-white', 'text-[#343144]' ); button.classList.add( 'bg-[#52aa98]', 'text-[#343146]', 'ring-1' ); // Get the combination text and find matching variant const combinationText = button.getAttribute('data-variant-combo'); const comboValues = combinationText.split(' / '); // Get variants data and find matching variant const variants = JSON.parse(container.getAttribute('data-variants')); const matchedVariant = findVariantByCombination(variants, comboValues); if (matchedVariant) { updateProductDisplay(container, matchedVariant); // Check if we need to switch between add button and quantity modifier // when variant changes - use setTimeout to ensure variant ID is updated first if (!skipCartCheck) { setTimeout(() => window.checkCartAndUpdateSingleContainer(container), 50); } } }; window.selectVariantCombinationFromSelect = window.selectVariantCombinationFromSelect || function(selectEl, skipCartCheck = false) { const container = selectEl.closest('[data-product-container]'); const combinationText = selectEl.value; if (!combinationText) return; const comboValues = combinationText.split(' / '); const variants = JSON.parse(container.getAttribute('data-variants')); const matchedVariant = findVariantByCombination(variants, comboValues); if (matchedVariant) { updateProductDisplay(container, matchedVariant); if (!skipCartCheck) { setTimeout(() => window.checkCartAndUpdateSingleContainer(container), 50); } } }; // Find a variant by option combination function findVariantByCombination(variants, comboValues) { return variants.find(variant => { // Match all option values for (let i = 0; i < comboValues.length; i++) { if (variant.options[i]?.value !== comboValues[i]) { return false; } } return true; }); } // Function to update button icons based on quantity function updateButtonIcons(container, quantity) { const decreaseBtn = container.querySelector('[data-decrease-btn]'); if (!decreaseBtn) return; const minusIcon = decreaseBtn.querySelector('.minus-icon'); const trashIcon = decreaseBtn.querySelector('.trash-icon'); if (quantity <= 1) { // Show trash icon if (minusIcon) minusIcon.style.display = 'none'; if (trashIcon) trashIcon.style.display = 'block'; } else { // Show minus icon if (minusIcon) minusIcon.style.display = 'block'; if (trashIcon) trashIcon.style.display = 'none'; } } // Cache for cart data to avoid excessive API calls window.cartCache = window.cartCache || null; window.cartCacheTime = window.cartCacheTime || 0; window.CART_CACHE_DURATION = window.CART_CACHE_DURATION || 2000; // 2 seconds // Function to get cart data (with caching) window.getCartData = window.getCartData || async function() { const now = Date.now(); if (window.cartCache && (now - window.cartCacheTime) < window.CART_CACHE_DURATION) { return window.cartCache; } try { const response = await fetch('/api/cart'); const cart = await response.json(); window.cartCache = cart; window.cartCacheTime = now; return cart; } catch (error) { console.error('Error fetching cart:', error); return { items: [] }; } }; // Function to update UI for a specific container function updateContainerCartUI(container, cart) { const product = JSON.parse(container.getAttribute('data-variants')); if (!product || product.length === 0) return; // Don't update UI if there's an active error message if (container.getAttribute('data-has-error') === 'true') { return; } // Get the current selected variant ID const variantIdInput = container.querySelector('[data-variant-id]'); const currentVariantId = variantIdInput ? variantIdInput.value : null; if (!currentVariantId) return; // Find if this specific variant is in the cart const cartItem = cart.items ? cart.items.find(item => item.variant && item.variant.id === currentVariantId ) : null; const addForm = container.querySelector('[data-add-form]'); const quantityModifier = container.querySelector('[data-quantity-modifier]'); const quantitySpan = container.querySelector('[data-quantity]'); if (cartItem) { // Show quantity modifier for this specific variant if (addForm) addForm.style.display = 'none'; if (quantityModifier) { quantityModifier.style.display = 'flex'; // Set the item ID and quantity quantityModifier.setAttribute('data-item-id', cartItem.id); if (quantitySpan) { quantitySpan.textContent = cartItem.quantity; // Update button icons based on quantity updateButtonIcons(container, cartItem.quantity); } } } else { // Show add to cart button - this variant is not in cart if (addForm) addForm.style.display = 'block'; if (quantityModifier) quantityModifier.style.display = 'none'; } } // Function to check cart and update UI for all containers window.checkCartAndUpdateUI = window.checkCartAndUpdateUI || async function() { try { const cart = await window.getCartData(); document.querySelectorAll('[data-product-container]').forEach(container => { updateContainerCartUI(container, cart); }); } catch (error) { console.error('Error checking cart:', error); } }; // Function to check cart and update UI for a specific container only window.checkCartAndUpdateSingleContainer = window.checkCartAndUpdateSingleContainer || async function(container) { try { const cart = await window.getCartData(); updateContainerCartUI(container, cart); } catch (error) { console.error('Error checking cart for container:', error); } }; // Clear cart cache when cart is modified window.clearCartCache = window.clearCartCache || function() { window.cartCache = null; window.cartCacheTime = 0; }; // Show inline error message for product card function showInlineErrorForCard(container, message) { const errorContainer = container.querySelector('[data-product-error-message]'); const errorText = container.querySelector('[data-error-message-text]'); if (errorContainer && errorText) { errorText.textContent = message; errorContainer.style.display = 'block'; // Mark the container as having an error to prevent UI updates from hiding it container.setAttribute('data-has-error', 'true'); // Auto-hide after 8 seconds (increased from 6) const timeoutId = setTimeout(() => { container.removeAttribute('data-has-error'); hideInlineErrorForCard(errorContainer.querySelector('button')); }, 8000); // Store timeout ID so we can clear it if needed container.setAttribute('data-error-timeout', timeoutId); } } // Hide inline error message for product card window.hideInlineErrorForCard = window.hideInlineErrorForCard || function(button) { const errorContainer = button.closest('[data-product-error-message]'); const container = button.closest('[data-product-container]'); if (errorContainer) { errorContainer.style.display = 'none'; } if (container) { // Clear the error state and timeout container.removeAttribute('data-has-error'); const timeoutId = container.getAttribute('data-error-timeout'); if (timeoutId) { clearTimeout(parseInt(timeoutId)); container.removeAttribute('data-error-timeout'); } } }; // Optimistically show quantity modifier when add to cart is clicked function showQuantityModifierOptimistically(button) { const container = button.closest('[data-product-container]'); const addForm = container.querySelector('[data-add-form]'); const quantityModifier = container.querySelector('[data-quantity-modifier]'); const quantitySpan = container.querySelector('[data-quantity]'); // Hide add to cart button if (addForm) addForm.style.display = 'none'; // Show quantity modifier with quantity 1 if (quantityModifier) { quantityModifier.style.display = 'flex'; if (quantitySpan) { quantitySpan.textContent = '1'; updateButtonIcons(container, 1); } } } // Revert optimistic update on error function revertOptimisticUpdate(button) { const container = button.closest('[data-product-container]'); const addForm = container.querySelector('[data-add-form]'); const quantityModifier = container.querySelector('[data-quantity-modifier]'); // Show add to cart button again if (addForm) addForm.style.display = 'block'; // Hide quantity modifier if (quantityModifier) quantityModifier.style.display = 'none'; } / DELETE', headers: { 'HX-Request': 'true', 'HX-Trigger': button.id } }); if (response.ok) { // Clear cache and trigger cartUpdated event to update all cart badges window.clearCartCache(); document.body.dispatchEvent(new Event('cartUpdated')); // Show add to cart button again const addForm = container.querySelector('[data-add-form]'); if (addForm) addForm.style.display = 'block'; quantityModifier.style.display = 'none'; toast(storefrontProductMessages.removedFromCart, 'info', true); } } else { // Update quantity const formData = new FormData(); formData.append('quantity', newQuantity.toString()); const response = await fetch(`/api/cart/update/${itemId}`, { method: 'PUT', body: formData, headers: { 'HX-Request': 'true', 'HX-Trigger': button.id } }); if (response.ok) { quantitySpan.textContent = newQuantity; // Update button icons based on new quantity updateButtonIcons(container, newQuantity); // Clear cache and trigger cartUpdated event to update all cart badges window.clearCartCache(); document.body.dispatchEvent(new Event('cartUpdated')); } else { // Handle error response with inline error const errorText = await response.text(); showInlineErrorForCard(container, errorText || storefrontProductMessages.updateQuantityError); } } } catch (error) { console.error('Error updating quantity:', error); showInlineErrorForCard(container, storefrontProductMessages.updateQuantityError); } finally { // Re-enable buttons and hide spinner buttons.forEach(btn => btn.disabled = false); if (loadingSpinner) loadingSpinner.style.display = 'none'; } }; // Update product display with selected variant function updateProductDisplay(container, variant) { const inventoryQuantityDisplayThreshold = 5; const priceElement = container.querySelector('[data-variant-price]'); const inventoryElement = container.querySelector('[data-variant-inventory]'); const variantIdInput = container.querySelector('[data-variant-id]'); const addToCartButton = container.querySelector('[data-add-to-cart]'); const imageElement = container.querySelector('.product-image'); const isEventCard = container.querySelector('.eventDateText') !== null; // Update variant ID variantIdInput.value = variant.id; // Update image if variant has images if (imageElement && variant.images && variant.images.length > 0) { imageElement.src = variant.images[0]; } else if (imageElement) { // Fallback to default product image const defaultImage = imageElement.getAttribute('data-default-image'); if (defaultImage) { imageElement.src = defaultImage; } } // Update price priceElement.textContent = window.formatStorefrontMoney(variant.price_money, 'smart-trim'); // Update inventory status if (variant.inventory_quantity > 0) { if (variant.inventory_quantity < 5 && (isEventCard || variant.inventory_quantity < inventoryQuantityDisplayThreshold)) { setProductInventoryMessage( inventoryElement, storefrontProductMessages.lowStock.replace('999999999', String(variant.inventory_quantity)), "text-[#ff0000] inventoryLow" ); } else if (!isEventCard && variant.inventory_quantity < inventoryQuantityDisplayThreshold) { setProductInventoryMessage( inventoryElement, storefrontProductMessages.inStockCount.replace('999999999', String(variant.inventory_quantity)), "text-[#343144] inventoryInStock" ); } else { setProductInventoryMessage( inventoryElement, storefrontProductMessages.inStock, 'text-[#343144] inventoryInStock' ); } // Enable add to cart button addToCartButton.disabled = false; addToCartButton.classList.remove('bg-gray-400', 'cursor-not-allowed'); addToCartButton.classList.add('bg-[#c4d8d4]'); addToCartButton.textContent = storefrontProductMessages.addToCart; } else { // Out of stock setProductInventoryMessage( inventoryElement, storefrontProductMessages.outOfStock, 'text-[#343146] inventoryOutOfStock' ); // Disable add to cart button addToCartButton.disabled = true; addToCartButton.classList.remove('bg-[#c4d8d4]'); addToCartButton.classList.add('bg-gray-400', 'cursor-not-allowed'); addToCartButton.textContent = storefro iled to add to cart", addedToCart: "__SHADOWPOS_PRODUCT__ has been added to cart", removedFromCart: "Item removed from cart", updateQuantityError: "Failed to update quantity" }); const setProductInventoryMessage = (element, message, className) => { element.replaceChildren(); const status = document.createElement('span'); status.className = className; status.textContent = message; element.appendChild(status); }; document.addEventListener('DOMContentLoaded', function() { // Initialize each product card with inventory indicators // Cart check is now handled within initializeProductOptionsOnPage initializeProductOptionsOnPage(); }); // Listen for HTMX afterSwap events to initialize newly added products document.body.addEventListener('htmx:afterSwap', function(event) { if (event.detail.target && (event.detail.target.id === 'products-grid' || event.detail.target.id === 'advanced-search-results')) { // Only initialize products in the new content that was swapped in const newContainers = event.detail.target.querySelectorAll('[data-product-container]'); newContainers.forEach(container => { initializeProductOptions(container, true); // Skip individual cart checks }); // Check cart status for all products once after initialization setTimeout(() => window.checkCartAndUpdateUI(), 100); } }); // Initialize all product options on the current page function initializeProductOptionsOnPage() { document.querySelectorAll('[data-product-container]').forEach(container => { initializeProductOptions(container, true); // Skip cart check during batch initialization }); // Check cart once after all products are initialized setTimeout(() => window.checkCartAndUpdateUI(), 100); } // Initialize product options with inventory indicators function initializeProductOptions(container, skipCartCheck = false) { // Select the first available variant by default const variants = JSON.parse(container.getAttribute('data-variants')); if (!variants || variants.length === 0) return; const buttons = container.querySelectorAll('.variant-option-button'); const variantSelect = container.querySelector('.variant-option-select'); if (buttons.length > 0) { // Highlight the first button by default window.selectVariantCombination(buttons[0], skipCartCheck); } else if (variantSelect && variantSelect.value) { window.selectVariantCombinationFromSelect(variantSelect, skipCartCheck); } } // Function to select a variant combination window.selectVariantCombination = window.selectVariantCombination || function(button, skipCartCheck = false) { const container = button.closest('[data-product-container]'); // Remove active class from all buttons container.querySelectorAll('.variant-option-button').forEach(btn => { btn.classList.remove( 'bg-[#52aa98]', 'text-[#343146]', 'ring-1' ); btn.classList.add( 'bg-white', 'text-[#343144]' ); }); // Add active class to selected button button.classList.remove( 'bg-white', 'text-[#343144]' ); button.classList.add( 'bg-[#52aa98]', 'text-[#343146]', 'ring-1' ); // Get the combination text and find matching variant const combinationText = button.getAttribute('data-variant-combo'); const comboValues = combinationText.split(' / '); // Get variants data and find matching variant const variants = JSON.parse(container.getAttribute('data-variants')); const matchedVariant = findVariantByCombination(variants, comboValues); if (matchedVariant) { updateProductDisplay(container, matchedVariant); // Check if we need to switch between add button and quantity modifier // when variant changes - use setTimeout to ensure variant ID is updated first if (!skipCartCheck) { setTimeout(() => window.checkCartAndUpdateSingleContainer(container), 50); } } }; window.selectVariantCombinationFromSelect = window.selectVariantCombinationFromSelect || function(selectEl, skipCartCheck = false) { const container = selectEl.closest('[data-product-container]'); const combinationText = selectEl.value; if (!combinationText) return; const comboValues = combinationText.split(' / '); const variants = JSON.parse(container.getAttribute('data-variants')); const matchedVariant = findVariantByCombination(variants, comboValues); if (matchedVariant) { updateProductDisplay(container, matchedVariant); if (!skipCartCheck) { setTimeout(() => window.checkCartAndUpdateSingleContainer(container), 50); } } }; // Find a variant by option combination function findVariantByCombination(variants, comboValues) { return variants.find(variant => { // Match all option values for (let i = 0; i < comboValues.length; i++) { if (variant.options[i]?.value !== comboValues[i]) { return false; } } return true; }); } // Function to update button icons based on quantity function updateButtonIcons(container, quantity) { const decreaseBtn = container.querySelector('[data-decrease-btn]'); if (!decreaseBtn) return; const minusIcon = decreaseBtn.querySelector('.minus-icon'); const trashIcon = decreaseBtn.querySelector('.trash-icon'); if (quantity <= 1) { // Show trash icon if (minusIcon) minusIcon.style.display = 'none'; if (trashIcon) trashIcon.style.display = 'block'; } else { // Show minus icon if (minusIcon) minusIcon.style.display = 'block'; if (trashIcon) trashIcon.style.display = 'none'; } } // Cache for cart data to avoid excessive API calls window.cartCache = window.cartCache || null; window.cartCacheTime = window.cartCacheTime || 0; window.CART_CACHE_DURATION = window.CART_CACHE_DURATION || 2000; // 2 seconds // Function to get cart data (with caching) window.getCartData = window.getCartData || async function() { const now = Date.now(); if (window.cartCache && (now - window.cartCacheTime) < window.CART_CACHE_DURATION) { return window.cartCache; } try { const response = await fetch('/api/cart'); const cart = await response.json(); window.cartCache = cart; window.cartCacheTime = now; return cart; } catch (error) { console.error('Error fetching cart:', error); return { items: [] }; } }; // Function to update UI for a specific container function updateContainerCartUI(container, cart) { const product = JSON.parse(container.getAttribute('data-variants')); if (!product || product.length === 0) return; // Don't update UI if there's an active error message if (container.getAttribute('data-has-error') === 'true') { return; } // Get the current selected variant ID const variantIdInput = container.querySelector('[data-variant-id]'); const currentVariantId = variantIdInput ? variantIdInput.value : null; if (!currentVariantId) return; // Find if this specific variant is in the cart const cartItem = cart.items ? cart.items.find(item => item.variant && item.variant.id === currentVariantId ) : null; const addForm = container.querySelector('[data-add-form]'); const quantityModifier = container.querySelector('[data-quantity-modifier]'); const quantitySpan = container.querySelector('[data-quantity]'); if (cartItem) { // Show quantity modifier for this specific variant if (addForm) addForm.style.display = 'none'; if (quantityModifier) { quantityModifier.style.display = 'flex'; // Set the item ID and quantity quantityModifier.setAttribute('data-item-id', cartItem.id); if (quantitySpan) { quantitySpan.textContent = cartItem.quantity; // Update button icons based on quantity updateButtonIcons(container, cartItem.quantity); } } } else { // Show add to cart button - this variant is not in cart if (addForm) addForm.style.display = 'block'; if (quantityModifier) quantityModifier.style.display = 'none'; } } // Function to check cart and update UI for all containers window.checkCartAndUpdateUI = window.checkCartAndUpdateUI || async function() { try { const cart = await window.getCartData(); document.querySelectorAll('[data-product-container]').forEach(container => { updateContainerCartUI(container, cart); }); } catch (error) { console.error('Error checking cart:', error); } }; // Function to check cart and update UI for a specific container only window.checkCartAndUpdateSingleContainer = window.checkCartAndUpdateSingleContainer || async function(container) { try { const cart = await window.getCartData(); updateContainerCartUI(container, cart); } catch (error) { console.error('Error checking cart for container:', error); } }; // Clear cart cache when cart is modified window.clearCartCache = window.clearCartCache || function() { window.cartCache = null; window.cartCacheTime = 0; }; // Show inline error message for product card function showInlineErrorForCard(container, message) { const errorContainer = container.querySelector('[data-product-error-message]'); const errorText = container.querySelector('[data-error-message-text]'); if (errorContainer && errorText) { errorText.textContent = message; errorContainer.style.display = 'block'; // Mark the container as having an error to prevent UI updates from hiding it container.setAttribute('data-has-error', 'true'); // Auto-hide after 8 seconds (increased from 6) const timeoutId = setTimeout(() => { container.removeAttribute('data-has-error'); hideInlineErrorForCard(errorContainer.querySelector('button')); }, 8000); // Store timeout ID so we can clear it if needed container.setAttribute('data-error-timeout', timeoutId); } } // Hide inline error message for product card window.hideInlineErrorForCard = window.hideInlineErrorForCard || function(button) { const errorContainer = button.closest('[data-product-error-message]'); const container = button.closest('[data-product-container]'); if (errorContainer) { errorContainer.style.display = 'none'; } if (container) { // Clear the error state and timeout container.removeAttribute('data-has-error'); const timeoutId = container.getAttribute('data-error-timeout'); if (timeoutId) { clearTimeout(parseInt(timeoutId)); container.removeAttribute('data-error-timeout'); } } }; // Optimistically show quantity modifier when add to cart is clicked function showQuantityModifierOptimistically(button) { const container = button.closest('[data-product-container]'); const addForm = container.querySelector('[data-add-form]'); const quantityModifier = container.querySelector('[data-quantity-modifier]'); const quantitySpan = container.querySelector('[data-quantity]'); // Hide add to cart button if (addForm) addForm.style.display = 'none'; // Show quantity modifier with quantity 1 if (quantityModifier) { quantityModifier.style.display = 'flex'; if (quantitySpan) { quantitySpan.textContent = '1'; updateButtonIcons(container, 1); } } } // Revert optimistic update on error function revertOptimisticUpdate(button) { const container = button.closest('[data-product-container]'); const addForm = container.querySelector('[data-add-form]'); const quantityModifier = container.querySelector('[data-quantity-modifier]'); // Show add to cart button again if (addForm) addForm.style.display = 'block'; // Hide quantity modifier if (quantityModifier) quantityModifier.style.display = 'none'; } // Handle add to cart response (both success and error) function handleAddToCartResponse(event, button, productId) { const xhr = event.detail.xhr; if (xhr.status === 200) { // Success - show success toast const productTitle = button.closest('[data-product-container]').querySelector('.productTitle').textContent; toast(storefrontProductMessages.addedToCart.replace('__SHADOWPOS_PRODUCT__', productTitle), 'success', true); // Clear cart cache and trigger cartUpdated event to update all cart badges window.clearCartCache(); document.body.dispatchEvent(new Event('cartUpdated')); // Update UI with actual cart data (shorter timeout since we're already showing the modifier) setTimeout(() => { window.checkCartAndUpdateUI(); }, 100); } else { // Error - revert optimistic update and show inline error revertOptimisticUpdate(button); const errorText = xhr.responseText || storefrontProductMessages.addToCartError; const container = button.closest('[data-product-container]'); // Show inline error instead of toast for better user focus showInlineErrorForCard(container, errorText); } } // Update quantity function window.updateQuantity = window.updateQuantity || async function(button, change) { const container = button.closest('[data-product-container]'); const quantityModifier = container.querySelector('[data-quantity-modifier]'); const quantitySpan = container.querySelector('[data-quantity]'); const loadingSpinner = container.querySelector('[data-loading-spinner]'); const itemId = quantityModifier.getAttribute('data-item-id'); if (!itemId) return; const currentQuantity = parseInt(quantitySpan.textContent); const newQuantity = currentQuantity + change; // Disable buttons and show spinner during update const buttons = quantityModifier.querySelectorAll('button'); buttons.forEach(btn => btn.disabled = true); if (loadingSpinner) loadingSpinner.style.display = 'flex'; try { if (newQuantity <= 0) { // Remove item from cart const response = await fetch(`/api/cart/remove/${itemId}`, { method: 'DELETE', headers: { 'HX-Request': 'true', 'HX-Trigger': button.id } }); if (response.ok) { // Clear cache and trigger cartUpdated event to update all cart badges window.clearCartCache(); document.body.dispatchEvent(new Event('cartUpdated')); // Show add to cart button again const addForm = container.querySelector('[data-add-form]'); if (addForm) addForm.style.display = 'block'; quantityModifier.style.display = 'none'; toast(storefrontProductMessages.removedFromCart, 'info', true); } } else { // Update quantity const formData = new FormData(); formData.append('quantity', newQuantity.toString()); const response = await fetch(`/api/cart/update/${itemId}`, { method: 'PUT', body: formData, headers: { 'HX-Request': 'true', 'HX-Trigger': button.id } }); if (response.ok) { quantitySpan.textContent = newQuantity; // Update button icons based on new quantity updateButtonIcons(container, newQuantity); // Clear cache and trigger cartUpdated event to update all cart badges window.clearCartCache(); document.body.dispatchEvent(new Event('cartUpdated')); } else { // Handle error response with inline error const errorText = await response.text(); showInlineErrorForCard(container, errorText || storefrontProductMessages.updateQuantityError); } } } catch (error) { console.error('Error updating quantity:', error); showInlineErrorForCard(container, storefrontProductMessages.updateQuantityError); } finally { // Re-enable buttons and hide spinner buttons.forEach(btn => btn.disabled = false); if (loadingSpinner) loadingSpinner.style.display = 'none'; } }; // Update product display with selected variant function updateProductDisplay(container, variant) { const inventoryQuantityDisplayThreshold = 5; const priceElement = container.querySelector('[data-variant-price]'); const inventoryElement = container.querySelector('[data-variant-inventory]'); const variantIdInput = container.querySelector('[data-variant-id]'); const addToCartButton = container.querySelector('[data-add-to-cart]'); const imageElement = container.querySelector('.product-image'); const isEventCard = container.querySelector('.eventDateText') !== null; // Update variant ID variantIdInput.value = variant.id; // Update image if variant has images if (imageElement && variant.images && variant.images.length > 0) { imageElement.src = variant.images[0]; } else if (imageElement) { // Fallback to default product image const defaultImage = imageElement.getAttribute('data-default-image'); if (defaultImage) { imageElement.src = defaultImage; } } // Update price priceElement.textContent = window.formatStorefrontMoney(variant.price_money, 'smart-trim'); // Update inventory status if (variant.inventory_quantity > 0) { if (variant.inventory_quantity < 5 && (isEventCard || variant.inventory_quantity < inventoryQuantityDisplayThreshold)) { setProductInventoryMessage( inventoryElement, storefrontProductMessages.lowStock.replace('999999999', String(variant.inventory_quantity)), "text-[#ff0000] inventoryLow" ); } else if (!isEventCard && variant.inventory_quantity < inventoryQuantityDisplayThreshold) { setProductInventoryMessage( inventoryElement, storefrontProductMessages.inStockCount.replace('999999999', String(variant.inventory_quantity)), "text-[#343144] inventoryInStock" ); } else { setProductInventoryMessage( inventoryElement, storefrontProductMessages.inStock, 'text-[#343144] inventoryInStock' ); } // Enable add to cart button addToCartButton.disabled = false; addToCartButton.classList.remove('bg-gray-400', 'cursor-not-allowed'); addToCartButton.classList.add('bg-[#c4d8d4]'); addToCartButton.textContent = storefrontProductMessages.addToCart; } else { // Out of stock setProductInventoryMessage( inventoryElement, storefrontProductMessages.outOfStock, 'text-[#343146] inventoryOutOfStock' ); // Disable add to cart button addToCartButton.disabled = true; addToCartButton.classList.remove('bg-[#c4d8d4]'); addToCartButton.classList.add('bg-gray-400', 'cursor-not-allowed'); addToCartButton.textContent = storefrontProductMessages.outOfStock; } } } // End of initialization check </script> </div> <div id="load-more-trigger" class="h-10 w-full -mt-200" hx-get="/api/advanced-search?initialLoad=false" data-advanced-search-request="more" hx-trigger="advanced-more queue:none, advanced-search-retry queue:none" hx-sync="this:drop" hx-target="#products-grid" hx-swap="beforeend swap:0 settle:0" hx-include="#infinite-scroll-form" hx-indicator="#loading-indicator"> </div> </div>
